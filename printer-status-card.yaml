type: custom:printer-status-card
name: Ender 3 V3 KE
language: en
show_camera: true
camera_view: live
show_progress: true
show_system_load: true
show_memory: true
show_thumbnail: true
show_emergency_stop: true
show_filament_required: true
file_metadata_service: rest_command.get_file_metadata
filament_present_state: "on"
filament_missing_state: "off"
spoolman:
  set_active_spool_service: rest_command.set_spool_id
  get_active_spool_service: rest_command.get_active_spool_id
  spool_entity_template: sensor.spoolman_spool_{id}
  filament_name_entity_template: sensor.spoolman_spool_{id}_filament_name
  filament_material_entity_template: sensor.spoolman_spool_{id}_filament_material
  vendor_name_entity_template: sensor.spoolman_spool_{id}_vendor_name
  color_hex_entity_template: sensor.spoolman_spool_{id}_color_hex
  id_entity_template: sensor.spoolman_spool_{id}_id
entities:
  status: sensor.tucana_current_print_state
  remaining_time: sensor.tucana_print_time_left
  elapsed_time: sensor.tucana_print_duration
  filament_used: sensor.tucana_filament_used
  bed_temp: sensor.tucana_bed_temperature
  extruder_temp: sensor.tucana_extruder_temperature
  total_print_time: sensor.tucana_total_print_time
  filament_present: binary_sensor.tucana_filament_sensor
  filename: sensor.tucana_filename
  progress: sensor.tucana_progress
  current_layer: sensor.tucana_current_layer
  total_layer: sensor.tucana_total_layer
  system_load: sensor.tucana_system_load
  memory_used: sensor.tucana_memory_used
  bed_target: number.tucana_bed_target
  extruder_target: number.tucana_extruder_target
  thumbnail: camera.tucana_thumbnail
  emergency_stop: button.tucana_emergency_stop
  camera: camera.tucana_webcam
  power_switch: switch.tucana_plug
  power_now: sensor.tucana_plug_power
  spool_id: sensor.tucana_spool_id
macros:
  - name: Pause
    entity: button.tucana_pause_print

  - name: Resume
    entity: button.tucana_resume_print

  - name: Cancel
    entity: button.tucana_cancel_print

  - name: Home axes
    service: moonraker.send_gcode
    service_data:
      device_id: 0553efa9d6cc67430d711d21ecca853e
      gcode: G28

  - name: Home all axes Z extrude
    entity: button.tucana_macro_home_all_z_up_extrude

  - name: Preheat PLA
    service: moonraker.send_gcode
    service_data:
      device_id: 0553efa9d6cc67430d711d21ecca853e
      gcode: |-
        M104 S210
        M140 S60

  - name: Motors off
    service: moonraker.send_gcode
    service_data:
      device_id: 0553efa9d6cc67430d711d21ecca853e
      gcode: M84

  - name: Cooldown
    service: moonraker.send_gcode
    service_data:
      device_id: 0553efa9d6cc67430d711d21ecca853e
      gcode: TURN_OFF_HEATERS
